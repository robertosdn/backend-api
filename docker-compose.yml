services:
  rest-server:
    build:
      context: .
      target: production
    ports:
      - "8080:8080"
    restart: unless-stopped
    container_name: backend-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/hello"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  rest-test:
    build:
      context: .
      target: test
    container_name: backend-api-test
    profiles:
      - test